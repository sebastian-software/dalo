[graph]
all-features = true

[advisories]
ignore = []
yanked = "deny"

[licenses]
# Org-wide permissive allow-list. Keep it in sync with the family baseline
# rather than widening it per crate; narrower, crate-scoped grants belong in
# `exceptions` below.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# Crate-scoped grants that stay narrower than the allow-list above.
exceptions = [
  { allow = ["ISC"], crate = "ring" },
  { allow = ["ISC"], crate = "rustls-webpki" },
  { allow = ["BSD-3-Clause"], crate = "subtle" },
  { allow = ["ISC"], crate = "untrusted" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
