name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Keep macos-latest as the macOS test runner. macos-14 applies a
          # restrictive sandbox that rejects the repository's hook fixtures, so
          # it is reserved for the release builds in `release-targets` and
          # `publish.yml`, which do not run the fixture suite.
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Installer and workflow tests
        run: sh tests/install.sh && sh tests/docs.sh && sh tests/workflows.sh

      - name: npm wrapper test
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: npm wrapper checks
        run: cd npm && npm ci && npm run check-version && npm test

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Release build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  release-targets:
    name: Release target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # This runner executes the GNU test suite natively. Keeping ARM
          # execution native avoids making release confidence depend on QEMU.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: cargo
            test: cargo
            smoke: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
            test: cross
            smoke: true
            # The pinned Cross image deliberately lacks bash, which the CLI
            # fixture suite requires. Keep the full target library suite and
            # exercise the release CLI below without adding image-time setup.
          # Compile this release target with the same pinned cross version as
          # publishing. Running it would require QEMU, so native ARM GNU tests
          # above provide deterministic ARM execution coverage instead.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
            test: none
            smoke: false
          - os: macos-14
            target: x86_64-apple-darwin
            builder: cargo
            test: none
            smoke: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-target-${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.builder == 'cross' }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Run target test suite
        if: ${{ matrix.test != 'none' }}
        shell: bash
        run: |
          if [ "${{ matrix.test }}" = "cross" ]; then
            cross test --locked --target "${{ matrix.target }}" --lib
          else
            cargo test --locked --target "${{ matrix.target }}"
          fi

      - name: Smoke test musl release binary
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          test_root="$(mktemp -d "${TMPDIR:-/tmp}/dalo-release-smoke.XXXXXX")"
          trap 'rm -rf "$test_root"' EXIT
          binary="target/${{ matrix.target }}/release/dalo"
          "$binary" init --store "$test_root/store"
          "$binary" target link generic "$test_root/skills" --store "$test_root/store"
          "$binary" sync --store "$test_root/store" --dry-run

  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify MSRV toolchain
        run: rustc "+${{ steps.msrv.outputs.version }}" --version

      - name: Check
        run: cargo "+${{ steps.msrv.outputs.version }}" check --locked --all-targets --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Audit dependencies
        run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.4 --locked

      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines "$(cat coverage-threshold)"

  site:
    name: Site render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # The documentation rendered from docs/*.md and the stamped landing page
      # under site/ are committed. Failing here keeps a stale render from
      # reaching the Pages deploy on main, which runs the same check.
      - name: Check site render
        env:
          # corepack downloads pnpm on first use; never wait on a prompt in CI.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack pnpm --dir site install --frozen-lockfile
          node site/build.mjs --check
