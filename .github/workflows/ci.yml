name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Keep the established macOS test runner: macos-14 applies a
          # restrictive sandbox that rejects the repository's hook fixtures.
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Installer and workflow tests
        run: sh tests/install.sh && sh tests/docs.sh && sh tests/workflows.sh

      - name: npm wrapper test
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: npm wrapper checks
        run: cd npm && npm run check-version && npm test

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Release build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  release-targets:
    name: Release target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # This runner executes the GNU test suite natively. Keeping ARM
          # execution native avoids making release confidence depend on QEMU.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: cargo
            test: cargo
            smoke: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
            test: cross
            smoke: true
            # The pinned Cross image deliberately lacks bash, which the CLI
            # fixture suite requires. Keep the full target library suite and
            # exercise the release CLI below without adding image-time setup.
          # Compile this release target with the same pinned cross version as
          # publishing. Running it would require QEMU, so native ARM GNU tests
          # above provide deterministic ARM execution coverage instead.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
            test: none
            smoke: false
          - os: macos-14
            target: x86_64-apple-darwin
            builder: cargo
            test: none
            smoke: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-target-${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.builder == 'cross' }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Run target test suite
        if: ${{ matrix.test != 'none' }}
        shell: bash
        run: |
          if [ "${{ matrix.test }}" = "cross" ]; then
            cross test --locked --target "${{ matrix.target }}" --lib
          else
            cargo test --locked --target "${{ matrix.target }}"
          fi

      - name: Smoke test musl release binary
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          test_root="$(mktemp -d "${TMPDIR:-/tmp}/dalo-release-smoke.XXXXXX")"
          trap 'rm -rf "$test_root"' EXIT
          binary="target/${{ matrix.target }}/release/dalo"
          "$binary" init --store "$test_root/store"
          "$binary" target link generic "$test_root/skills" --store "$test_root/store"
          "$binary" sync --store "$test_root/store" --dry-run

  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify MSRV toolchain
        run: rustc +1.93 --version

      - name: Check
        run: cargo +1.93 check --locked --all-targets --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Audit dependencies
        run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.4 --locked

      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-features --summary-only
