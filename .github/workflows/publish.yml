name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing release tag to resume after a failed publish
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.recovery.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.recovery.outputs.tag_name || steps.release.outputs.tag_name }}
      release_is_draft: ${{ steps.recovery.outputs.release_is_draft }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ github.event_name == 'push' || inputs.recover_tag == '' }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Validate release recovery
        id: recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.recover_tag }}
        run: |
          case "$TAG_NAME" in
            dalo-v*|v*) ;;
            *) echo "::error::unexpected release tag '${TAG_NAME}'"; exit 1 ;;
          esac
          release_is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
          case "$release_is_draft" in
            true|false) ;;
            *) echo "::error::could not determine release state for '${TAG_NAME}'"; exit 1 ;;
          esac
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_is_draft=$release_is_draft" >> "$GITHUB_OUTPUT"

  publish-crate:
    name: Publish crate
    # GitHub assets publish first. This keeps every public install channel from
    # advertising a release whose archives are not yet available.
    needs: [release-please, publish-github-release]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && (needs.publish-github-release.result == 'success' || needs.release-please.outputs.release_is_draft == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # crates.io exchanges this GitHub Actions OIDC token for a short-lived
      # publish credential.
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Trusted Publishing has to be enabled for the `dalo` crate on crates.io
      # before this can mint a token. Until then the step fails softly and the
      # publish falls back to the long-lived CARGO_REGISTRY_TOKEN secret.
      - name: Authenticate with crates.io
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          case "$TAG_NAME" in
            dalo-v*) version="${TAG_NAME#dalo-v}" ;;
            v*) version="${TAG_NAME#v}" ;;
            *) echo "::error::unexpected release tag '${TAG_NAME}'"; exit 1 ;;
          esac
          if curl \
            --user-agent "dalo-publish/${version} (https://github.com/${{ github.repository }})" \
            --fail --silent --show-error \
            "https://crates.io/api/v1/crates/dalo/${version}" > /dev/null; then
            echo "dalo ${version} is already published on crates.io"
            exit 0
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io credential: enable Trusted Publishing for the dalo crate or set CARGO_REGISTRY_TOKEN"
            exit 1
          fi
          cargo publish --locked

  publish-npm:
    name: Publish npm wrapper
    needs: [release-please, publish-github-release]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && (needs.publish-github-release.result == 'success' || needs.release-please.outputs.release_is_draft == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm exchanges this GitHub Actions OIDC token for a short-lived publish
      # credential. No NPM_TOKEN is required or consumed.
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm wrapper
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          case "$TAG_NAME" in
            dalo-v*) version="${TAG_NAME#dalo-v}" ;;
            v*) version="${TAG_NAME#v}" ;;
            *) echo "::error::unexpected release tag '${TAG_NAME}'"; exit 1 ;;
          esac
          cd npm
          if test -f package-lock.json; then
            npm ci
          elif node -e 'const p = require("./package.json"); process.exit(Object.keys(p.dependencies || {}).length + Object.keys(p.devDependencies || {}).length === 0 ? 0 : 1)'; then
            echo "No package-lock.json or dependencies in legacy release; skipping npm install"
          else
            echo "::error::package-lock.json is missing for an npm package with dependencies"
            exit 1
          fi
          test "$(node -p 'require("./package.json").version')" = "$version"
          if npm view "getdalo@${version}" version > /dev/null 2>&1; then
            echo "getdalo ${version} is already published on npm"
            exit 0
          fi
          npm test
          npm pack --dry-run
          DALO_VERSION="$TAG_NAME" node -e "require('./lib/release').ensureBinary().then(binary => require('node:child_process').execFileSync(binary, ['--version'], { stdio: 'inherit' }))"
          npm publish --access public

  release-artifacts:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.release_is_draft != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
          - os: macos-14
            target: x86_64-apple-darwin
            builder: cargo
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.builder == 'cross' }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package artifact
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$TAG_NAME" in
            dalo-v*) version="${TAG_NAME#dalo-v}" ;;
            v*) version="${TAG_NAME#v}" ;;
            *)
              echo "::error::unexpected release tag '${TAG_NAME}'"
              exit 1
              ;;
          esac
          package="dalo-${version}-${TARGET}"
          mkdir -p "dist/${package}"
          mkdir -p "dist/${package}/completions" "dist/${package}/man/man1"
          cp "target/${TARGET}/release/dalo" "dist/${package}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${package}/"
          cargo run --locked -- completions bash > "dist/${package}/completions/dalo.bash"
          cargo run --locked -- completions zsh > "dist/${package}/completions/_dalo"
          cargo run --locked -- completions fish > "dist/${package}/completions/dalo.fish"
          cargo run --locked -- manpage > "dist/${package}/man/man1/dalo.1"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (
            cd dist
            shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"
          )

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release archive
        shell: bash
        run: |
          for archive in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = true
          gh release upload "$TAG_NAME" dist/*.tar.gz dist/*.sha256 dist/*.sigstore.json --clobber

  publish-github-release:
    name: Publish GitHub release
    needs: [release-please, release-artifacts]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.release_is_draft != 'false' && needs.release-artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify staged artifacts and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = true
          case "$TAG_NAME" in
            dalo-v*) version="${TAG_NAME#dalo-v}" ;;
            v*) version="${TAG_NAME#v}" ;;
            *) echo "::error::unexpected release tag '${TAG_NAME}'"; exit 1 ;;
          esac
          uploaded_assets="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            archive="dalo-${version}-${target}.tar.gz"
            for asset in "$archive" "$archive.sha256" "$archive.sigstore.json"; do
              printf '%s\n' "$uploaded_assets" | grep -Fx -- "$asset" > /dev/null
            done
          done
          gh release edit "$TAG_NAME" --draft=false

  update-homebrew:
    name: Update Homebrew tap
    needs: [release-please, publish-github-release]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && (needs.publish-github-release.result == 'success' || needs.release-please.outputs.release_is_draft == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Trigger formula update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test -n "$GH_TOKEN"
          case "$TAG_NAME" in
            dalo-v*) version="${TAG_NAME#dalo-v}" ;;
            v*) version="${TAG_NAME#v}" ;;
            *) echo "::error::unexpected release tag '${TAG_NAME}'"; exit 1 ;;
          esac
          formula="$(gh api repos/sebastian-software/homebrew-tap/contents/Formula/dalo.rb --jq '.content' | base64 --decode)"
          current_tag="$(printf '%s\n' "$formula" | sed -n 's#.*releases/download/\([^/]*\)/.*#\1#p' | head -n 1)"
          if [ -n "$current_tag" ]; then
            case "$current_tag" in
              dalo-v*) current_version="${current_tag#dalo-v}" ;;
              v*) current_version="${current_tag#v}" ;;
              *) echo "::error::unexpected Homebrew release tag '${current_tag}'"; exit 1 ;;
            esac
            newest_version="$(printf '%s\n%s\n' "$current_version" "$version" | sort -V | tail -n 1)"
            if [ "$current_version" = "$version" ] || [ "$newest_version" = "$current_version" ]; then
              echo "Homebrew already references dalo ${current_version}; not dispatching ${version}"
              exit 0
            fi
          fi
          gh api --method POST repos/sebastian-software/homebrew-tap/dispatches \
            -f event_type=dalo_release \
            -F "client_payload[tag_name]=$TAG_NAME"
