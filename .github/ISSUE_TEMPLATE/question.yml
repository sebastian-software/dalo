name: Question (fallback)
description: Only when Discussions is unavailable to you. Usage questions belong in Discussions Q&A.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        **Ask in [Discussions → Q&A](https://github.com/sebastian-software/dalo/discussions/categories/q-a) instead.**
        That is where questions get answered and stay findable for the next person with the same one.

        This form exists only as a fallback for people who cannot use Discussions.
        Read [`SUPPORT.md`](https://github.com/sebastian-software/dalo/blob/main/SUPPORT.md)
        and the documentation first. A question opened here may be moved to Discussions.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you blocked?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: The command or API call, the version, and the documentation page involved. Remove credentials and private data.
